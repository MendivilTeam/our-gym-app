grumphp:
    environment:
        variables:
            DB_HOST: 127.0.0.1
    tasks:
        git_commit_message:
            matchers:
                Format "[#issue] - Description": '/^\[#\d+\] - \S.*/'
            enforce_capitalized_subject: false
            max_subject_width: 72
            max_body_width: 72
        shell:
            scripts:
                - ["-c", "vendor/bin/pint --test"]
            triggered_by: [php]
        phpstan:
            configuration: phpstan.neon
            memory_limit: "-1"
            use_grumphp_paths: false
        phpunit:
            always_execute: true
